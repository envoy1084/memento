[profile.default]
src = "src"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "../chain/src/deployments" }]
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]

[fmt]
line_length = 100
